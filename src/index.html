<!DOCTYPE html>
<html>

<head>
  <title>BSL-editor</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8">    
  <style>
    html,
    body {
      height: 100%;
      margin: 0px;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #editor-workspace {
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      min-width: 0;
      overflow: hidden;
    }
    #container {
      min-height: 0;
      min-width: 0;
      flex: 1 1 auto;
    }
  </style>
</head>

<body>

  <div id="help-file-loader" class="bsl-help-file-loader" hidden>
    <span class="bsl-help-file-caption">Справка 1С</span>
    <input id="help-file-input" class="bsl-help-file-input" type="file" accept=".hbk" multiple
      title="Выберите shcntx_*.hbk, shlang_*.hbk, shquery_*.hbk и/или dcsui_*.hbk">
    <button id="help-file-load" class="bsl-help-file-button" type="button" disabled>Загрузить</button>
    <button id="help-file-show" class="bsl-help-file-button" type="button">Открыть справку</button>
    <span id="help-file-status" class="bsl-help-file-result" role="status" aria-live="polite">
      Выберите shcntx_*.hbk, shlang_*.hbk, shquery_*.hbk и/или dcsui_*.hbk
    </span>
  </div>
  <div id="editor-workspace">
    <div id="container"></div>
  </div>
  <div id="display">
    <div id="display-header">
      <div id="display-title"></div>
      <div id="display-close"></div>
    </div>
    <div id="variables-display">
      <div id="variables-tree"></div>
    </div>    
  </div>
  <button id="event-button"></button>

  <script>
    function getCode() {
      return '';
    }
  </script>  

</body>

</html>
