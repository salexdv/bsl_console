<!DOCTYPE html>
<html>

<head>
  <title>Query model inspector</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Segoe UI, sans-serif;
    }

    #layout {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
      grid-template-rows: 36px minmax(0, 1fr);
      height: 100%;
      background: #f4f1ea;
    }

    #toolbar {
      grid-column: 1 / 3;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 12px;
      color: #342b22;
      background: linear-gradient(90deg, #f7edd8, #e8f0e2);
      border-bottom: 1px solid #d8cbb8;
      font-size: 13px;
      white-space: nowrap;
    }

    #toolbar strong {
      font-size: 14px;
    }

    #status {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #container,
    #model-container {
      min-width: 0;
      min-height: 0;
    }

    #container {
      border-right: 1px solid #d8cbb8;
    }

    .query-model-active-line {
      background: rgba(220, 151, 69, 0.28);
      outline: 1px solid rgba(207, 125, 47, 0.45);
    }

    .query-model-active-glyph {
      background: #cf7d2f;
      border-radius: 50%;
    }

    .query-model-linked-query-range {
      background: rgba(72, 128, 103, 0.22);
      outline: 1px solid rgba(72, 128, 103, 0.42);
    }
  </style>
</head>

<body>
  <div id="layout">
    <div id="toolbar">
      <strong>query_model inspector</strong>
      <span>Слева запрос, справа tolerant-модель. Кликните в запросе, чтобы раскрыть активный узел в JSON.</span>
      <span id="status"></span>
    </div>
    <div id="container"></div>
    <div id="model-container"></div>
  </div>
  <div id="display" style="display: none;">
    <div id="display-header">
      <div id="display-title"></div>
      <div id="display-close"></div>
    </div>
    <div id="variables-display">
      <div id="variables-tree"></div>
    </div>
  </div>
  <button id="event-button" style="display: none;"></button>

  <script>
    function getCode() {
      return [
        'ВЫБРАТЬ',
        '	Товары.Ссылка КАК Ссылка,',
        '	Товары.Код КАК Код,',
        '	Товары.Наименование КАК Наименование,',
        '	Товары.СтавкаНДС КАК СтавкаНДС,',
        '	СУММА(Товары.СтавкаНДС.Значение) КАК Сумма',
        'ИЗ',
        '	Справочник.Товары КАК Товары',
        'ГДЕ',
        '	Товары.СтавкаНДС <> &БезНДС',
        ';',
        '',
        '////////////////////////////////////////////////////////////////////////////////',
        'ВЫБРАТЬ',
        '	СведенияОДоходах.ФизическоеЛицо КАК ФизическоеЛицо',
        'ПОМЕСТИТЬ ВТФизлицаБезОблагаемойБазы',
        'ИЗ',
        '	ВТРасширенныеСведенияОДоходах КАК СведенияОДоходах',
        'ГДЕ',
        '	СведенияОДоходах.Регистратор <> &ИсключаемыйРегистратор',
        '',
        'СГРУППИРОВАТЬ ПО',
        '	СведенияОДоходах.ФизическоеЛицо',
        '',
        'ИМЕЮЩИЕ',
        '	СУММА(ВЫБОР',
        '			КОГДА СведенияОДоходах.ВходитВБазуПФР',
        '					ИЛИ СведенияОДоходах.ВходитВБазуФОМС',
        '				ТОГДА СведенияОДоходах.Сумма - СведенияОДоходах.Скидка',
        '			ИНАЧЕ 0',
        '		КОНЕЦ) < 0',
        '',
        'ИНДЕКСИРОВАТЬ ПО',
        '	ФизическоеЛицо',
        ';',
        '',
        '////////////////////////////////////////////////////////////////////////////////',
        'ВЫБРАТЬ',
        '	ИсчисленныеСтраховыеВзносы.Период КАК Период,',
        '	ИсчисленныеСтраховыеВзносы.ДатаПолученияДохода КАК ДатаПолученияДохода,',
        '	ИсчисленныеСтраховыеВзносы.Регистратор КАК Регистратор,',
        '	ИсчисленныеСтраховыеВзносы.ГоловнаяОрганизация КАК ГоловнаяОрганизация,',
        '	ИсчисленныеСтраховыеВзносы.ФизическоеЛицо КАК ФизическоеЛицо,',
        '	ИсчисленныеСтраховыеВзносы.Организация КАК Организация,',
        '	ИсчисленныеСтраховыеВзносы.ПФРПоСуммарномуТарифу КАК ПФРПоСуммарномуТарифу,',
        '	ИсчисленныеСтраховыеВзносы.ПФРПоСуммарномуТарифуЕНВД КАК ПФРПоСуммарномуТарифуЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ФСС КАК ФСС,',
        '	ИсчисленныеСтраховыеВзносы.ФССЕНВД КАК ФССЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ФССНесчастныеСлучаи КАК ФССНесчастныеСлучаи,',
        '	ИсчисленныеСтраховыеВзносы.ФФОМС КАК ФФОМС,',
        '	ИсчисленныеСтраховыеВзносы.ФФОМСЕНВД КАК ФФОМСЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ПФРНаДоплатуЛетчикам КАК ПФРНаДоплатуЛетчикам,',
        '	ИсчисленныеСтраховыеВзносы.ПФРНаДоплатуШахтерам КАК ПФРНаДоплатуШахтерам,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботах КАК ПФРЗаЗанятыхНаПодземныхИВредныхРаботах,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахОпасный КАК ПФРЗаЗанятыхНаПодземныхИВредныхРаботахОпасный,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный1 КАК ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный1,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный2 КАК ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный2,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный3 КАК ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный3,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный4 КАК ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный4,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботах КАК ПФРЗаЗанятыхНаТяжелыхИПрочихРаботах,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахОпасный КАК ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахОпасный,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный1 КАК ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный1,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный2 КАК ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный2,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный3 КАК ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный3,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный4 КАК ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный4,',
        '	ИсчисленныеСтраховыеВзносы.ДатаПолученияДохода КАК ДатаПолученияДохода1,',
        '	ИсчисленныеСтраховыеВзносы.ПФРДоПредельнойВеличины КАК ПФРДоПредельнойВеличины,',
        '	ИсчисленныеСтраховыеВзносы.ПФРДоПредельнойВеличиныЕНВД КАК ПФРДоПредельнойВеличиныЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ПФРСПревышения КАК ПФРСПревышения,',
        '	ИсчисленныеСтраховыеВзносы.ПФРСПревышенияЕНВД КАК ПФРСПревышенияЕНВД',
        'ПОМЕСТИТЬ ВТДанныеУчетаВзносов',
        'ИЗ',
        '	РегистрНакопления.ИсчисленныеСтраховыеВзносы КАК ИсчисленныеСтраховыеВзносы',
        '		ЛЕВОЕ СОЕДИНЕНИЕ ВТФизлицаБезОблагаемойБазы КАК ФизлицаБезОблагаемойБазы',
        '		ПО ИсчисленныеСтраховыеВзносы.ФизическоеЛицо = ФизлицаБезОблагаемойБазы.ФизическоеЛицо',
        'ГДЕ',
        '	ИсчисленныеСтраховыеВзносы.ГоловнаяОрганизация = &ГоловнаяОрганизация',
        '	И ИсчисленныеСтраховыеВзносы.Период МЕЖДУ &НачалоПредыдущегоГода И &ДатаОкончанияРегистрации',
        '	И ИсчисленныеСтраховыеВзносы.ДатаПолученияДохода МЕЖДУ &НачалоГода И &КонецМесяца',
        '	И НЕ ИсчисленныеСтраховыеВзносы.ФизическоеЛицо В',
        '				(ВЫБРАТЬ',
        '					СписокСотрудников.ФизическоеЛицо',
        '				ИЗ',
        '					ВТФизлицаБезОблагаемойБазы КАК СписокСотрудников',
        '				ГДЕ',
        '					СписокСотрудников.ФизическоеЛицо <> &ПустоеФизлицо)',
        '					И НЕ СписокСотрудников.ФизическоеЛицо ЕСТЬ NULL)',
        '	И ИсчисленныеСтраховыеВзносы.ФизическоеЛицо В',
        '			(ВЫБРАТЬ',
        '				СписокСотрудников.ФизическоеЛицо',
        '			ИЗ',
        '				ВТФизическиеЛица КАК СписокСотрудников)',
        '	И ИсчисленныеСтраховыеВзносы.Регистратор <> &Регистратор',
        '	И ФизлицаБезОблагаемойБазы.ФизическоеЛицо ЕСТЬ NULL',
        '',
        'ОБЪЕДИНИТЬ ВСЕ',
        '',
        'ВЫБРАТЬ',
        '	ИсчисленныеСтраховыеВзносы.Период,',
        '	ИсчисленныеСтраховыеВзносы.ДатаПолученияДохода,',
        '	ИсчисленныеСтраховыеВзносы.Регистратор,',
        '	ИсчисленныеСтраховыеВзносы.ГоловнаяОрганизация,',
        '	ИсчисленныеСтраховыеВзносы.ФизическоеЛицо,',
        '	ИсчисленныеСтраховыеВзносы.Организация,',
        '	ИсчисленныеСтраховыеВзносы.ПФРПоСуммарномуТарифу,',
        '	ИсчисленныеСтраховыеВзносы.ПФРПоСуммарномуТарифуЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ФСС,',
        '	ИсчисленныеСтраховыеВзносы.ФССЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ФССНесчастныеСлучаи,',
        '	ИсчисленныеСтраховыеВзносы.ФФОМС,',
        '	ИсчисленныеСтраховыеВзносы.ФФОМСЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ПФРНаДоплатуЛетчикам,',
        '	ИсчисленныеСтраховыеВзносы.ПФРНаДоплатуШахтерам,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботах,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахОпасный,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный1,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный2,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный3,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаПодземныхИВредныхРаботахВредный4,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботах,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахОпасный,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный1,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный2,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный3,',
        '	ИсчисленныеСтраховыеВзносы.ПФРЗаЗанятыхНаТяжелыхИПрочихРаботахВредный4,',
        '	ИсчисленныеСтраховыеВзносы.ДатаПолученияДохода,',
        '	ИсчисленныеСтраховыеВзносы.ПФРДоПредельнойВеличины,',
        '	ИсчисленныеСтраховыеВзносы.ПФРДоПредельнойВеличиныЕНВД,',
        '	ИсчисленныеСтраховыеВзносы.ПФРСПревышения,',
        '	ИсчисленныеСтраховыеВзносы.ПФРСПревышенияЕНВД',
        'ИЗ',
        '	ВТРегистрНакопления_ИсчисленныеСтраховыеВзносы КАК ИсчисленныеСтраховыеВзносы',
        'ГДЕ',
        '	ИсчисленныеСтраховыеВзносы.ГоловнаяОрганизация = &ГоловнаяОрганизация',
        '	И ИсчисленныеСтраховыеВзносы.Период МЕЖДУ &НачалоПредыдущегоГода И &ДатаОкончанияРегистрации',
        '	И ИсчисленныеСтраховыеВзносы.ДатаПолученияДохода МЕЖДУ &НачалоГода И &КонецМесяца',
        '	И ИсчисленныеСтраховыеВзносы.ФизическоеЛицо В',
        '			(ВЫБРАТЬ',
        '				СписокСотрудников.ФизическоеЛицо',
        '			ИЗ',
        '				ВТФизическиеЛица КАК СписокСотрудников)',
        '	И ИсчисленныеСтраховыеВзносы.Регистратор <> &Регистратор',
        ';'
      ].join('\n');
    }
  </script>
  <script src="./vs/loader.js"></script>
  <script src="./parsers.js"></script>
  <script src="./finder.js"></script>
  <script src="./bsl_helper.js"></script>
  <script src="./init.js"></script>
  <script src="./tree/tree.js"></script>
  <script src="./test_query_model.js"></script>
</body>

</html>
